      "guidance_id": "3d-shape-differential",
      "official_name": "3D Differential",
      "aliases": ["shape difference", "allowable range", "reference image difference", "invalid pixel difference"],
      "contextual_scope": "FAMILY_NOT_ESTABLISHED",
      "applicability": {"controller_family": null, "mode": "CONTEXT_REQUIRED"},
      "purpose": "Contextual tuning guidance for comparison of a current 3D shape with a reference image; exact availability, labels, and behavior must be confirmed for the selected controller/software.",
      "parameter_guidance": [
        {"parameter": "Allowable range", "effect": "Differences outside the configured range are detected; the legacy help describes values in millimetres and independently selectable Z and XY treatment.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Area filter lower limit", "effect": "Raising the lower limit suppresses detected regions smaller than the configured area, which can remove small noise components.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Background-plane offset", "effect": "Excludes content below a configured background reference height.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Invalid pixels as detection target", "effect": "Choose deliberately: enabling detects changes around invalid pixels; disabling can suppress over-detection there.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Projection emphasis", "effect": "May make smaller shape changes detectable without lowering the allowable range.", "status": "OFFICIAL_CONTEXTUAL"}
      ],
      "cautions": ["This is not evidence that a named 3D Differential tool exists on LJ-X8000, LJ-X8000A, or LJ-S8000.", "Confirm tool name, units, and actual effect in the applicable manual/UI before changing a production inspection."],
