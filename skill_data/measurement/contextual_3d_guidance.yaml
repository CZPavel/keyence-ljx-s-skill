    {
      "guidance_id": "3d-shape-search",
      "official_name": "3D Search",
      "aliases": ["3d model search", "detection level", "detection count", "edge extraction threshold", "plane mask"],
      "contextual_scope": "FAMILY_NOT_ESTABLISHED",
      "applicability": {"controller_family": null, "mode": "CONTEXT_REQUIRED"},
      "purpose": "Contextual tuning guidance for locating a registered 3D shape/model; exact availability and UI labels must be confirmed for the selected controller/software.",
      "parameter_guidance": [
        {"parameter": "Detection count", "effect": "Set high enough to include all expected objects within the measurement area.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Detection level", "effect": "Lower it when an expected object is missed; raise it when an unintended object is detected.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Edge extraction threshold", "effect": "Lowering can recover weak contour features; raising can suppress irrelevant contours and false detections.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Plane/box masks", "effect": "Masking near a supporting plane or container bottom can suppress false detections, but an excessive mask can remove thin or flat parts.", "status": "OFFICIAL_CONTEXTUAL"},
        {"parameter": "Fixed versus tracked box", "effect": "The legacy guidance says a tracked box accommodates position change with longer processing time than a fixed box.", "status": "OFFICIAL_CONTEXTUAL"}
      ],
      "cautions": ["This record must not be treated as a family-specific tool specification.", "Use it to form a diagnostic question, then verify the current manual/UI and test on representative data."],
